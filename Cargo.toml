[package]
name = "validate"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = { version = "0.34.0", default-features = false }
serde = {
  version = "1.0.214",
  default-features = false,
  features = [
    "derive",
    "std",
  ],
  optional = true
}
thiserror = { version = "2.0.16", default-features = false }

[features]
default = ["std"]
std = ["dep:serde", "nalgebra/serde-serialize"]

[lints.clippy]
