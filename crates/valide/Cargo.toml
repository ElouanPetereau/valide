[package]
name = "valide"
version.workspace = true
edition.workspace = true
description = "A crate for types that can only be built through a validation, with validated setters to patch them."
readme = "../../README.md"
repository = "https://github.com/ElouanPetereau/valide"
license = "MIT"
publish = ["crates-io"]

[dependencies]
valide_derive = { path = "../valide_derive", version = "=0.1.0", default-features = false, optional = true }

[dev-dependencies]
nalgebra = { version = "0.34.0", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
serde = {
  version = "1.0.214",
  default-features = false,
  features = [
    "derive",
    "std",
  ]
}
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.16", default-features = false }
valide_derive = { path = "../valide_derive", default-features = false }

[features]
default = ["derive"]
# Enable the derive macros that generate a lots of boilerplate code for this crate traits.
derive = ["dep:valide_derive"]

[lints]
workspace = true
