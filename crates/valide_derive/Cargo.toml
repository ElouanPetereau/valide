[package]
name = "valide_derive"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
syn = {
  version = "3.0",
  default-features = false,
  features = [
    "clone-impls",
    "derive",
    "full",
    "parsing",
    "printing",
    "proc-macro",
  ]
}

[dev-dependencies]
serde = { version = "1.0.214", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.16", default-features = false }
trybuild = { version = "1.0", default-features = false }
valide = { path = "../valide", default-features = false }

[lints]
workspace = true
